name: Build Test24soat APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Flutter project
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate project
        run: |
          flutter create --platforms=android test24soat
          cd test24soat
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';

          void main() => runApp(const Test24App());

          class Test24App extends StatelessWidget {
            const Test24App({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorSchemeSeed: Colors.indigo,
                  useMaterial3: true,
                ),
                home: Scaffold(
                  appBar: AppBar(title: const Text('Test24soat')),
                  body: const Center(
                    child: Text(
                      'Test24soat ishlayapti!',
                      style: TextStyle(
                        fontSize: 24,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          EOF
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: test24soat-apk
          path: test24soat/build/app/outputs/flutter-apk/app-release.apk
